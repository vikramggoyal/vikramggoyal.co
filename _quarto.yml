project:
  type: website
  output-dir: _site
  resources:
    - CNAME          # copied into _site so it lands on the gh-pages branch
  render:
    - "*.qmd"        # index, about, blog
    - "posts/"
    - "links/"
    - "!book/"       # the book is its own project; built + deployed separately (see notes)

website:
  title: "Vikram G Goyal"
  description: "Deterministic expectations in a Stochastic life"
  site-url: https://vikramggoyal.co
  twitter-card: true
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: blog.qmd
        text: Blog
      - href: about.qmd
        text: About
      - text: Links
        menu:
          - href: links/reading.qmd
            text: Books and Articles
          - href: links/videos_podcasts.qmd
            text: Videos and Podcasts
    right:
      - icon: github
        href: https://github.com/vikramggoyal
        aria-label: GitHub
      - icon: rss
        href: blog.xml
        aria-label: RSS
  page-footer:
    center: "© Vikram Goyal"

format:
  html:
    theme:
      - united
      - styles/custom.scss
    css: styles/print.css        # @media print rules; harmless on screen
    toc: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true

filters:
  - lightbox
lightbox: auto